<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Pop Motion Drill</title>
    <style>
      :root {
        background: #f8f4ea;
        color: #111111;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: #f8f4ea;
        display: grid;
        margin: 0;
        min-height: 100vh;
        place-items: center;
      }

      .stage {
        aspect-ratio: 9 / 16;
        background: #f8f4ea;
        height: min(100vh, 1920px);
        max-width: 100vw;
        overflow: hidden;
        position: relative;
        width: min(100vw, 1080px);
      }

      .asset-bg {
        height: 100%;
        inset: 0;
        object-fit: cover;
        opacity: 0.86;
        position: absolute;
        width: 100%;
        z-index: 0;
      }

      .stage::before,
      .stage::after {
        background:
          radial-gradient(circle, #ff4fa3 0 11px, transparent 12px);
        background-size: 58px 58px;
        content: "";
        height: 420px;
        opacity: 0.88;
        position: absolute;
        width: 420px;
        z-index: 1;
      }

      .stage::before {
        right: -88px;
        top: -72px;
      }

      .stage::after {
        bottom: 178px;
        left: -150px;
      }

      .grid {
        background-image:
          linear-gradient(rgb(17 17 17 / 8%) 2px, transparent 2px),
          linear-gradient(90deg, rgb(17 17 17 / 8%) 2px, transparent 2px);
        background-size: 96px 96px;
        inset: 0;
        opacity: 0.32;
        position: absolute;
      }

      .header {
        align-items: start;
        display: flex;
        gap: 28px;
        justify-content: space-between;
        left: 72px;
        position: absolute;
        right: 72px;
        top: 86px;
        z-index: 3;
      }

      .brand {
        filter: drop-shadow(7px 7px 0 rgb(17 17 17 / 45%));
        height: auto;
        margin-top: -18px;
        object-fit: contain;
        width: 230px;
      }

      .eyebrow {
        color: #111111;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: 0;
        margin: 0 0 12px;
        text-transform: uppercase;
      }

      .caption {
        color: #111111;
        font-size: 30px;
        font-weight: 800;
        margin: 0;
      }

      .scene {
        align-items: center;
        display: grid;
        inset: 0;
        justify-items: center;
        padding: 230px 72px 170px;
        position: absolute;
        text-align: center;
        z-index: 2;
      }

      .asset-prop {
        object-fit: contain;
        pointer-events: none;
        position: absolute;
        user-select: none;
        z-index: -1;
      }

      .asset-bubble {
        filter: drop-shadow(14px 14px 0 rgb(17 17 17 / 28%));
        left: 50%;
        max-width: none;
        top: 50%;
        width: 860px;
      }

      .asset-tag {
        filter: drop-shadow(14px 14px 0 rgb(17 17 17 / 24%));
        left: 50%;
        max-width: none;
        top: 50%;
        width: 840px;
      }

      .asset-paper {
        filter: drop-shadow(16px 16px 0 rgb(17 17 17 / 22%));
        left: 50%;
        max-width: none;
        top: 50%;
        width: 930px;
      }

      .label {
        background: #ffffff;
        border: 5px solid #111111;
        border-radius: 8px;
        box-shadow: 10px 10px 0 #111111;
        color: #111111;
        font-size: 28px;
        font-weight: 900;
        padding: 14px 24px;
      }

      .text {
        filter: drop-shadow(12px 12px 0 #111111);
        font-size: 138px;
        font-weight: 1000;
        letter-spacing: 0;
        line-height: 0.88;
        margin: 38px 0;
        max-width: 900px;
        text-transform: uppercase;
      }

      .subtext {
        color: #111111;
        font-size: 42px;
        font-weight: 900;
        line-height: 1.18;
        margin: 0;
        max-width: 780px;
      }

      .word-row {
        display: grid;
        gap: 22px;
        justify-items: center;
        margin: 38px 0;
      }

      .word {
        border-radius: 8px;
        color: #08080b;
        display: inline-block;
        font-size: 106px;
        font-weight: 1000;
        line-height: 1;
        padding: 18px 32px;
        text-transform: uppercase;
      }

      .word:nth-child(1) {
        background: #ffdd00;
      }

      .word:nth-child(2) {
        background: #34e89e;
      }

      .word:nth-child(3) {
        background: #00c2ff;
      }

      .stamp {
        background: #ffffff;
        border: 12px solid #111111;
        box-shadow: 18px 18px 0 #00c2ff;
        color: #ff4fa3;
        font-size: 126px;
        font-weight: 1000;
        line-height: 0.92;
        padding: 34px 38px;
        text-transform: uppercase;
        transform-origin: center;
      }

      .ring {
        border: 10px solid #00c2ff;
        border-radius: 999px;
        height: 360px;
        position: absolute;
        width: 360px;
      }

      .flash {
        background: #ffffff;
        inset: 0;
        opacity: 0;
        position: absolute;
        z-index: 4;
      }

      .footer {
        align-items: center;
        bottom: 78px;
        display: flex;
        gap: 18px;
        justify-content: space-between;
        left: 72px;
        position: absolute;
        right: 72px;
        z-index: 5;
      }

      .footer-logo {
        filter: drop-shadow(5px 5px 0 rgb(17 17 17 / 35%));
        height: 46px;
        object-fit: contain;
        width: 132px;
      }

      .bar {
        background: #ffffff;
        border: 4px solid #111111;
        border-radius: 999px;
        flex: 1;
        height: 18px;
        overflow: hidden;
      }

      .bar-fill {
        background: linear-gradient(90deg, #ffdd00, #34e89e, #00c2ff, #ff4fa3);
        height: 100%;
        transform-origin: left;
      }

      .timecode {
        color: #111111;
        font-size: 26px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="Text pop motion drill">
      <img class="asset-bg" src="./motion-drill-assets/bg.png" alt="" />
      <div class="grid"></div>
      <div class="header">
        <div>
          <p class="eyebrow" id="eyebrow">Motion Drill 01</p>
          <p class="caption" id="caption">Text pop animation - 3 styles</p>
        </div>
        <img class="brand" src="./motion-drill-assets/brand.png" alt="Tech Khangran" />
      </div>
      <section class="scene" id="scene"></section>
      <div class="flash" id="flash"></div>
      <footer class="footer">
        <img class="footer-logo" src="./motion-drill-assets/brand.png" alt="" />
        <div class="bar"><div class="bar-fill" id="bar"></div></div>
        <div class="timecode" id="timecode">00:00</div>
      </footer>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const clipMode = params.get("clip");
      const duration = clipMode ? 10 : 8;
      const bubbleAsset = "./motion-drill-assets/bubble.png";
      const tagAsset = "./motion-drill-assets/tag.png";
      const paperAsset = "./motion-drill-assets/paper.png";
      const scene = document.getElementById("scene");
      const eyebrow = document.getElementById("eyebrow");
      const caption = document.getElementById("caption");
      const flash = document.getElementById("flash");
      const bar = document.getElementById("bar");
      const timecode = document.getElementById("timecode");

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function easeOutBack(x) {
        const c1 = 1.70158;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
      }

      function easeOutCubic(x) {
        return 1 - Math.pow(1 - x, 3);
      }

      function pulse(local, start, length) {
        const x = clamp((local - start) / length, 0, 1);
        return Math.sin(x * Math.PI);
      }

      function formatTime(t) {
        const seconds = Math.floor(t).toString().padStart(2, "0");
        const frames = Math.floor((t % 1) * 30).toString().padStart(2, "0");
        return `00:${seconds}.${frames}`;
      }

      function renderBounce(local, words = "POP<br />FAST", note = "Scale 80% to 112%, settle at 100%") {
        const pop = easeOutBack(clamp(local / 0.48, 0, 1));
        const exit = clamp((local - 1.85) / 0.38, 0, 1);
        const scale = (0.2 + pop * 0.9) * (1 - exit * 0.18);
        const y = (1 - pop) * 170 - exit * 220;
        const opacity = clamp(local / 0.16, 0, 1) * (1 - exit);
        const ringScale = 0.65 + pulse(local, 0.08, 0.78) * 1.25;
        const ringOpacity = pulse(local, 0.08, 0.78) * 0.75;

        scene.innerHTML = `
          <img class="asset-prop asset-bubble" src="${bubbleAsset}" alt="" style="transform: translate(-50%, -50%) scale(${0.82 + pulse(local, 0.08, 0.78) * 0.08}); opacity:${0.82 * opacity}" />
          <div class="ring" style="transform: scale(${ringScale}); opacity: ${ringOpacity}"></div>
          <div>
            <span class="label">01 Bounce Pop</span>
            <h1 class="text" style="color:#ffdd00; transform: translateY(${y}px) scale(${scale}); opacity:${opacity}">${words}</h1>
            <p class="subtext" style="opacity:${opacity}">${note}</p>
          </div>
        `;
      }

      function renderSlide(local, words = ["HOOK", "VALUE", "CTA"], note = "Pop each word on a beat, keep spacing locked") {
        const renderedWords = words
          .map((word, index) => {
            const start = index * 0.28;
            const x = (1 - easeOutCubic(clamp((local - start) / 0.46, 0, 1))) * (index % 2 === 0 ? -420 : 420);
            const opacity = clamp((local - start) / 0.14, 0, 1);
            const exit = clamp((local - 2.05) / 0.3, 0, 1);
            return `<span class="word" style="transform: translateX(${x + exit * 280}px); opacity:${opacity * (1 - exit)}">${word}</span>`;
          })
          .join("");

        scene.innerHTML = `
          <img class="asset-prop asset-tag" src="${tagAsset}" alt="" style="transform: translate(-50%, -50%) scale(${0.88 + pulse(local, 0.2, 0.62) * 0.04}); opacity:0.55" />
          <div>
            <span class="label">02 Slide Stack</span>
            <div class="word-row">${renderedWords}</div>
            <p class="subtext">${note}</p>
          </div>
        `;
      }

      function renderStamp(local, words = "DONE<br />TODAY", note = "Overshoot, shake 8 frames, hold for proof") {
        const pop = easeOutBack(clamp(local / 0.34, 0, 1));
        const shake = Math.sin(local * 74) * Math.max(0, 1 - local * 1.6) * 16;
        const rotate = -8 + pop * 8 + shake * 0.14;
        const scale = 2.3 - pop * 1.3 + pulse(local, 0.12, 0.45) * 0.08;
        const exit = clamp((local - 1.92) / 0.42, 0, 1);
        const opacity = clamp(local / 0.08, 0, 1) * (1 - exit);

        scene.innerHTML = `
          <img class="asset-prop asset-paper" src="${paperAsset}" alt="" style="transform: translate(-50%, -50%) rotate(${rotate * 0.35}deg) scale(${0.8 + pulse(local, 0.12, 0.45) * 0.06}); opacity:${0.9 * opacity}" />
          <div>
            <span class="label">03 Impact Stamp</span>
            <h1 class="stamp" style="transform: rotate(${rotate}deg) scale(${scale}); opacity:${opacity}">${words}</h1>
            <p class="subtext" style="opacity:${opacity}">${note}</p>
          </div>
        `;
      }

      function renderEnd(local) {
        const pop = easeOutBack(clamp(local / 0.62, 0, 1));
        scene.innerHTML = `
          <div>
            <span class="label">Exported Drill</span>
            <h1 class="text" style="color:#ff4fa3; transform: scale(${0.5 + pop * 0.5})">3 TEXT<br />POPS</h1>
            <p class="subtext">Use this as a 5-10 sec daily motion proof</p>
          </div>
        `;
      }

      function renderClip(t) {
        const safeTime = clamp(t, 0, 9.999);
        bar.style.transform = `scaleX(${safeTime / duration})`;
        timecode.textContent = formatTime(safeTime);

        if (clipMode === "bounce") {
          eyebrow.textContent = "Motion Drill A";
          caption.textContent = "10s clip - bounce pop";
          const beats = [
            ["HOOK<br />FIRST", "Quick hook word bounce"],
            ["PRICE<br />POP", "Use for offer or number reveal"],
            ["CTA<br />NOW", "Final call-to-action bounce"],
          ];
          const index = Math.min(Math.floor(safeTime / 3.2), 2);
          const local = safeTime - index * 3.2;
          flash.style.opacity = Math.max(pulse(local, 0, 0.18), pulse(local, 2.7, 0.16)) * 0.16;
          renderBounce(local, beats[index][0], beats[index][1]);
          return;
        }

        if (clipMode === "slide") {
          eyebrow.textContent = "Motion Drill B";
          caption.textContent = "10s clip - slide stack";
          const beatSets = [
            [["HOOK", "PROOF", "CTA"], "Three-word content structure"],
            [["SAVE", "TIME", "SELL"], "Stack short benefit words"],
            [["POST", "PRINT", "DONE"], "Creator workflow stack"],
          ];
          const index = Math.min(Math.floor(safeTime / 3.2), 2);
          const local = safeTime - index * 3.2;
          flash.style.opacity = Math.max(pulse(local, 0, 0.18), pulse(local, 2.7, 0.16)) * 0.14;
          renderSlide(local, beatSets[index][0], beatSets[index][1]);
          return;
        }

        if (clipMode === "stamp") {
          eyebrow.textContent = "Motion Drill C";
          caption.textContent = "10s clip - impact stamp";
          const beats = [
            ["STOP<br />SCROLL", "Impact hook stamp"],
            ["HOT<br />DEAL", "Offer stamp with shake"],
            ["DONE<br />TODAY", "Proof stamp ending"],
          ];
          const index = Math.min(Math.floor(safeTime / 3.2), 2);
          const local = safeTime - index * 3.2;
          flash.style.opacity = Math.max(pulse(local, 0, 0.18), pulse(local, 2.68, 0.16)) * 0.18;
          renderStamp(local, beats[index][0], beats[index][1]);
        }
      }

      function render(t) {
        if (clipMode) {
          renderClip(t);
          return;
        }

        const safeTime = ((t % duration) + duration) % duration;
        bar.style.transform = `scaleX(${safeTime / duration})`;
        timecode.textContent = formatTime(safeTime);
        flash.style.opacity = Math.max(
          pulse(safeTime, 0, 0.18),
          pulse(safeTime, 2.42, 0.18),
          pulse(safeTime, 4.86, 0.18),
        ) * 0.18;

        if (safeTime < 2.42) {
          eyebrow.textContent = "Motion Drill 01";
          caption.textContent = "Text pop animation - bounce";
          renderBounce(safeTime);
        } else if (safeTime < 4.86) {
          eyebrow.textContent = "Motion Drill 02";
          caption.textContent = "Text pop animation - slide stack";
          renderSlide(safeTime - 2.42);
        } else if (safeTime < 7.1) {
          eyebrow.textContent = "Motion Drill 03";
          caption.textContent = "Text pop animation - impact";
          renderStamp(safeTime - 4.86);
        } else {
          eyebrow.textContent = "Motion Drill";
          caption.textContent = "8 second export";
          renderEnd(safeTime - 7.1);
        }
      }

      const frameTime = params.get("t");

      if (frameTime !== null) {
        render(Number(frameTime));
      } else {
        const startedAt = performance.now();
        function tick(now) {
          render((now - startedAt) / 1000);
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }
    </script>
  </body>
</html>
